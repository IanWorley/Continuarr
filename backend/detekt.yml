# CI runs `./gradlew detektMain detektTest`, which resolve types. Plain `./gradlew detekt` doesn't,
# and it silently skips about half of these rules.
empty-blocks:
  EmptyCatchBlock:
    active: true
  EmptyClassBlock:
    active: true
  EmptyDefaultConstructor:
    active: true
  EmptyDoWhileBlock:
    active: true
  EmptyElseBlock:
    active: true
  EmptyFinallyBlock:
    active: true
  EmptyForBlock:
    active: true
  EmptyFunctionBlock:
    active: true
  EmptyIfBlock:
    active: true
  EmptyInitBlock:
    active: true
  EmptyKotlinFile:
    active: true
  EmptySecondaryConstructor:
    active: true
  EmptyTryBlock:
    active: true
  EmptyWhenBlock:
    active: true
  EmptyWhileBlock:
    active: true

exceptions:
  ErrorUsageWithThrowable:
    active: true
  ExceptionRaisedInUnexpectedLocation:
    active: true
  InstanceOfCheckForException:
    active: true
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionInMain:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true

potential-bugs:
  AvoidReferentialEquality:
    active: true
  CastNullableToNonNullableType:
    active: true
  CharArrayToStringCall:
    active: true
  DontDowncastCollectionTypes:
    active: true
  DoubleMutabilityForCollection:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExitOutsideMain:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  HasPlatformType:
    active: true
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  ImplicitUnitReturnType:
    active: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  MapGetWithNotNullAssertionOperator:
    active: true
  MissingPackageDeclaration:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  PropertyUsedBeforeDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCatchBlock:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
    # A !! in a test fails the test loudly, which is what a test wants.
    excludes: ['**/test/**']
  UnsafeCast:
    active: true
  UnusedUnaryOperator:
    active: true
  UselessPostfixExpression:
    active: true
  WrongEqualsTypeParameter:
    active: true

performance:
  ForEachOnRange:
    active: true
  UnnecessaryInitOnArray:
    active: true
  UnnecessaryPartOfBinaryExpression:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

style:
  AbstractClassCanBeConcreteClass:
    active: true
  AbstractClassCanBeInterface:
    active: true
  DataClassShouldBeImmutable:
    active: true
  EqualsNullCall:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - value: 'TODO:'
        reason: 'Finish the change, or open an issue and reference it.'
      - value: 'FIXME:'
        reason: 'Fix the problem before merging.'
      - value: 'STOPSHIP:'
        reason: 'Fix the problem before merging.'
      - value: '(?i)(insert|add|put|write) (your )?(code|implementation|logic) here'
        reason: 'Scaffold placeholder; write the code or delete the comment.'
      - value: '(?i)implement (me|this)'
        reason: 'Scaffold placeholder; write the code or delete the comment.'
  ForbiddenImport:
    active: true
    # Tests may still use JDBC to read the tables underneath the entities they check, and may use a seeded Random.
    excludes: ['**/test/**']
    forbiddenImports:
      - value: 'org.springframework.jdbc.*'
        reason: 'Use a Spring Data JPA repository; for SQL JPA cannot express, use @Query(nativeQuery = true) on one.'
      - value: 'java.sql.*'
        reason: 'Use a Spring Data JPA repository; for SQL JPA cannot express, use @Query(nativeQuery = true) on one.'
      - value: 'javax.sql.*'
        reason: 'Use a Spring Data JPA repository; for SQL JPA cannot express, use @Query(nativeQuery = true) on one.'
      - value: 'java.util.Random'
        reason: 'java.util.Random is predictable. Use java.security.SecureRandom for anything secret, as SetupToken does.'
      - value: 'kotlin.random.*'
        reason: 'kotlin.random.Random is predictable. Use java.security.SecureRandom for anything secret, as SetupToken does.'
  ForbiddenMethodCall:
    active: true
    # Setting methods replaces detekt's defaults, so the first five entries repeat them.
    methods:
      - value: 'kotlin.io.print'
        reason: 'print does not allow you to configure the output stream. Use a logger instead.'
      - value: 'kotlin.io.println'
        reason: 'println does not allow you to configure the output stream. Use a logger instead.'
      - value: 'java.math.BigDecimal.<init>(kotlin.Double)'
        reason: 'BigDecimal(Double) keeps floating point error. Use BigDecimal.valueOf(Double) or String.toBigDecimalOrNull().'
      - value: 'java.math.BigDecimal.<init>(kotlin.String)'
        reason: 'BigDecimal(String) can throw NumberFormatException. Use String.toBigDecimalOrNull().'
      - value: 'kotlin.system.measureTimeMillis'
        reason: 'It is obsolete. Use kotlin.time.measureTime.'
      - value: 'java.lang.Thread.sleep'
        reason: 'A fixed sleep is slow and flaky. Poll for the condition with a timeout, or inject a java.time.Clock.'
      - value: 'java.util.concurrent.TimeUnit.sleep'
        reason: 'A fixed sleep is slow and flaky. Poll for the condition with a timeout, or inject a java.time.Clock.'
      - value: 'java.time.Instant.now()'
        reason: 'Inject a java.time.Clock and call Instant.now(clock), so tests can control time.'
      - value: 'java.time.LocalDateTime.now()'
        reason: 'Inject a java.time.Clock and call LocalDateTime.now(clock), so tests can control time.'
      - value: 'java.time.LocalDateTime.now(java.time.ZoneId)'
        reason: 'Inject a java.time.Clock and call LocalDateTime.now(clock), so tests can control time.'
      - value: 'java.time.OffsetDateTime.now()'
        reason: 'Inject a java.time.Clock and call OffsetDateTime.now(clock), so tests can control time.'
      - value: 'java.time.OffsetDateTime.now(java.time.ZoneId)'
        reason: 'Inject a java.time.Clock and call OffsetDateTime.now(clock), so tests can control time.'
      - value: 'java.time.ZonedDateTime.now()'
        reason: 'Inject a java.time.Clock and call ZonedDateTime.now(clock), so tests can control time.'
      - value: 'java.time.ZonedDateTime.now(java.time.ZoneId)'
        reason: 'Inject a java.time.Clock and call ZonedDateTime.now(clock), so tests can control time.'
      - value: 'java.time.LocalDate.now()'
        reason: 'Inject a java.time.Clock and call LocalDate.now(clock), so tests can control time.'
      - value: 'java.time.LocalDate.now(java.time.ZoneId)'
        reason: 'Inject a java.time.Clock and call LocalDate.now(clock), so tests can control time.'
      - value: 'java.lang.System.currentTimeMillis'
        reason: 'Inject a java.time.Clock and call clock.millis(), so tests can control time.'
      - value: 'java.lang.Math.random'
        reason: 'It draws from a predictable generator. Use java.security.SecureRandom for anything secret, as SetupToken does.'
      - value: 'kotlin.collections.random'
        reason: 'It draws from a predictable generator. Use java.security.SecureRandom for anything secret, as SetupToken does.'
      - value: 'kotlin.text.random'
        reason: 'It draws from a predictable generator. Use java.security.SecureRandom for anything secret, as SetupToken does.'
      - value: 'kotlin.ranges.random'
        reason: 'It draws from a predictable generator. Use java.security.SecureRandom for anything secret, as SetupToken does.'
  ForbiddenSuppress:
    active: true
    # @Suppress must not get around the JDBC ban, the !! rule, or the exception rules.
    rules:
      - 'UnsafeCallOnNullableType'
      - 'ForbiddenImport'
      - 'ForbiddenMethodCall'
      - 'SwallowedException'
      - 'TooGenericExceptionCaught'
      - 'EmptyCatchBlock'
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1']
  SerialVersionUIDInSerializableClass:
    active: true
  UnnecessaryApply:
    active: true
  UnnecessaryLet:
    active: true
  UnusedImport:
    active: true
  UnusedParameter:
    active: true
  UnusedPrivateClass:
    active: true
    # Spring Modulith reads @PackageInfo classes reflectively to declare each module.
    ignoreAnnotated: ['PackageInfo']
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedVariable:
    active: true
  VarCouldBeVal:
    active: true
  WildcardImport:
    active: true
    # detekt exempts java.util.* by default, which would let java.util.Random past ForbiddenImport.
    excludeImports: []

complexity:
  NestedScopeFunctions:
    active: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
