# CI runs `./gradlew detektMain detektTest`, which resolve types. Plain `./gradlew detekt` doesn't,
# and it silently skips about half of these rules.
empty-blocks:
  EmptyCatchBlock:
    active: true
  EmptyClassBlock:
    active: true
  EmptyDefaultConstructor:
    active: true
  EmptyDoWhileBlock:
    active: true
  EmptyElseBlock:
    active: true
  EmptyFinallyBlock:
    active: true
  EmptyForBlock:
    active: true
  EmptyFunctionBlock:
    active: true
  EmptyIfBlock:
    active: true
  EmptyInitBlock:
    active: true
  EmptyKotlinFile:
    active: true
  EmptySecondaryConstructor:
    active: true
  EmptyTryBlock:
    active: true
  EmptyWhenBlock:
    active: true
  EmptyWhileBlock:
    active: true

exceptions:
  ExceptionRaisedInUnexpectedLocation:
    active: true
  NotImplementedDeclaration:
    active: true
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true

potential-bugs:
  DontDowncastCollectionTypes:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  IgnoredReturnValue:
    active: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  MissingPackageDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnsafeCallOnNullableType:
    active: true
    # A !! in a test fails the test loudly, which is what a test wants.
    excludes: ['**/test/**']
  UselessPostfixExpression:
    active: true
  WrongEqualsTypeParameter:
    active: true

performance:
  ForEachOnRange:
    active: true
  UnnecessaryInitOnArray:
    active: true
  UnnecessaryPartOfBinaryExpression:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

style:
  AbstractClassCanBeConcreteClass:
    active: true
  AbstractClassCanBeInterface:
    active: true
  DataClassShouldBeImmutable:
    active: true
  EqualsNullCall:
    active: true
  ForbiddenComment:
    active: true
    comments:
      - value: 'TODO:'
        reason: 'Finish the change, or open an issue and reference it.'
      - value: 'FIXME:'
        reason: 'Fix the problem before merging.'
      - value: 'STOPSHIP:'
        reason: 'Fix the problem before merging.'
      - value: '(?i)(insert|add|put|write) (your )?(code|implementation|logic) here'
        reason: 'Scaffold placeholder; write the code or delete the comment.'
      - value: '(?i)implement (me|this)'
        reason: 'Scaffold placeholder; write the code or delete the comment.'
  ForbiddenImport:
    active: true
    # Tests may still use JDBC to read the tables underneath the entities they check.
    excludes: ['**/test/**']
    forbiddenImports:
      - value: 'org.springframework.jdbc.*'
        reason: 'Use a Spring Data JPA repository; for SQL JPA cannot express, use @Query(nativeQuery = true) on one.'
      - value: 'java.sql.*'
        reason: 'Use a Spring Data JPA repository; for SQL JPA cannot express, use @Query(nativeQuery = true) on one.'
      - value: 'javax.sql.*'
        reason: 'Use a Spring Data JPA repository; for SQL JPA cannot express, use @Query(nativeQuery = true) on one.'
  MagicNumber:
    active: true
    ignoreNumbers: ['-1', '0', '1']
  SerialVersionUIDInSerializableClass:
    active: true
  UnnecessaryApply:
    active: true
  UnnecessaryLet:
    active: true
  UnusedParameter:
    active: true
  UnusedPrivateClass:
    active: true
    # Spring Modulith reads @PackageInfo classes reflectively to declare each module.
    ignoreAnnotated: ['PackageInfo']
  WildcardImport:
    active: true

complexity:
  NestedScopeFunctions:
    active: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
