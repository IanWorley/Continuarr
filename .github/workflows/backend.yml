name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its in-flight run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Matches the Gradle toolchain in backend/build.gradle.kts.
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: temurin
  BACKEND_DIR: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      # Caches Gradle state and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6

      # Testcontainers uses the runner's Docker for Postgres.
      - name: Test
        working-directory: ${{ env.BACKEND_DIR }}
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: ${{ env.BACKEND_DIR }}/build/reports/tests
