# Changesets are written in Liquibase formatted SQL. List each file explicitly so
# the apply order is visible here and never depends on filename sorting.
databaseChangeLog:
  - include:
      file: changes/0001-event-publication.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0002-app-user.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0003-jellyfin-connection.sql
      relativeToChangelogFile: true
