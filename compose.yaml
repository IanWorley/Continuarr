services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: continuarr
      POSTGRES_PASSWORD: continuarr
      POSTGRES_DB: continuarr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuarr -d continuarr"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres18-data:
